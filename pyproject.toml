[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiozoneminder"
dynamic = ["version"]
description = "Async client for ZoneMinder, over API v3 (zm-api) or the built-in API v2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steve Gilvarry" }]
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.10"]
keywords = ["zoneminder", "zm-api", "cctv", "nvr", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "aioresponses>=0.7.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]
lint = ["mypy>=1.11", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/SteveGilvarry/aiozoneminder"
Issues = "https://github.com/SteveGilvarry/aiozoneminder/issues"
Changelog = "https://github.com/SteveGilvarry/aiozoneminder/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aiozoneminder/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["aiozoneminder"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["aiozoneminder"]
mypy_path = "src"
