name: CLA Assistant

# Checks that every pull request author has agreed to CLA.md before the PR can
# be merged. Signatures are kept in this repository, in
# signatures/version1/cla.json on the cla-signatures branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ZoneMinder/aiozoneminder/blob/main/CLA.md
          branch: cla-signatures
          # Bots never need to sign.
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/ZoneMinder/aiozoneminder/blob/main/CLA.md)
            and sign it by posting a comment on this pull request containing
            exactly: `I have read the CLA Document and I hereby sign the CLA`.
            You only need to sign once. To re-run the check, comment `recheck`.
          custom-pr-sign-comment: >-
            I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA.
